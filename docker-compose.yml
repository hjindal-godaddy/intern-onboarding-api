services:
  mongodb:
    image: mongo:7.0
    container_name: intern_onboarding_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: intern_onboarding
    volumes:
      - mongodb_data:/data/db
    networks:
      - intern_onboarding_network

  api:
    build: .
    container_name: intern_onboarding_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: intern_onboarding
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_NAME: Intern Onboarding API
      DEBUG: "True"
    depends_on:
      - mongodb
    networks:
      - intern_onboarding_network
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  intern_onboarding_network:
    driver: bridge

volumes:
  mongodb_data:
